    <text x="830" y="628" font-size="10">UNITS</text><text x="960" y="628" font-size="11">inches</text>
    <text x="830" y="663" font-size="10">REV/DATE</text><text x="960" y="663" font-size="11">v4.2 / 2026-05-06</text>
    <text x="830" y="698" font-size="10">STATUS</text><text x="960" y="698" font-size="11">Pre-CAD unwrap</text>
  </g>
