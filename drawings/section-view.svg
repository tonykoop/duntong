<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" width="1100" height="760" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1100" height="760" fill="white" stroke="black"/>
  <text x="40" y="44" font-size="24" font-weight="700">Duntong Section View And Fixture Concept</text>
  <text x="40" y="70" font-size="13">Review drawing. Verify in SolidWorks before CAM. Section through medium 12 in OD stave shell.</text>

  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#bbb" stroke-width="1"/>
    </pattern>
  </defs>

  <g id="section">
    <text x="80" y="120" font-size="16" font-weight="700">A-A cross section</text>
    <circle cx="300" cy="340" r="180" fill="url(#hatch)" stroke="black" stroke-width="2"/>
    <circle cx="300" cy="340" r="165" fill="white" stroke="black" stroke-width="1.5"/>
    <line x1="120" y1="340" x2="480" y2="340" stroke="#555" stroke-dasharray="8 4"/>
    <line x1="300" y1="160" x2="300" y2="520" stroke="#555" stroke-dasharray="8 4"/>
    <text x="490" y="305" font-size="12">OD 12.000</text>
    <text x="490" y="326" font-size="12">ID 11.000</text>
    <text x="490" y="347" font-size="12">wall/tongue thickness 0.500</text>
    <text x="490" y="368" font-size="12">12 stave shell, seams to be indexed</text>
    <line x1="300" y1="160" x2="300" y2="125" stroke="black"/>
    <text x="250" y="116" font-size="12">Datum D equator</text>
    <circle cx="300" cy="340" r="14" fill="white" stroke="black"/>
    <text x="296" y="345" font-size="12" font-weight="700">A</text>
  </g>

  <g id="tongue-section">
    <text x="720" y="120" font-size="16" font-weight="700">Tongue wall detail</text>
    <rect x="720" y="170" width="260" height="72" fill="#f7efe6" stroke="black" stroke-width="2"/>
    <path d="M780 242 v-108 h120 v108" fill="none" stroke="#8b4513" stroke-width="6" stroke-linecap="round"/>
    <line x1="1000" y1="170" x2="1000" y2="242" stroke="black"/>
    <line x1="980" y1="170" x2="1018" y2="170" stroke="black"/>
    <line x1="980" y1="242" x2="1018" y2="242" stroke="black"/>
    <text x="1018" y="210" font-size="12">t = 0.500</text>
    <text x="720" y="280" font-size="12">Slit width: 0.125 in nominal upcut kerf.</text>
    <text x="720" y="300" font-size="12">Tongue width: 1.500 in. Length varies by note.</text>
    <text x="720" y="320" font-size="12">Start long/flat for tuning trim.</text>
  </g>

  <g id="vblock">
    <text x="80" y="600" font-size="16" font-weight="700">V-block fixture concept</text>
    <path d="M160 690 L300 545 L440 690 Z" fill="#e8e8e8" stroke="black" stroke-width="2"/>
    <circle cx="300" cy="555" r="90" fill="none" stroke="#555" stroke-width="2"/>
    <line x1="210" y1="555" x2="390" y2="555" stroke="#555" stroke-dasharray="8 4"/>
    <text x="470" y="610" font-size="12">Clamp zones must stay clear of tongue toolpaths.</text>
    <text x="470" y="630" font-size="12">Index marks every 45 deg for eight tongues.</text>
    <text x="470" y="650" font-size="12">Run air-cut before instrument material.</text>
  </g>

  <g id="title-block">
    <rect x="720" y="560" width="330" height="150" fill="white" stroke="black"/>
    <line x1="720" y1="595" x2="1050" y2="595" stroke="black"/>
    <line x1="720" y1="630" x2="1050" y2="630" stroke="black"/>
    <line x1="720" y1="665" x2="1050" y2="665" stroke="black"/>
    <line x1="850" y1="560" x2="850" y2="710" stroke="black"/>
    <text x="730" y="583" font-size="10">PART</text><text x="860" y="583" font-size="11">Section and fixture</text>
    <text x="730" y="618" font-size="10">UNITS</text><text x="860" y="618" font-size="11">inches</text>
    <text x="730" y="653" font-size="10">REV/DATE</text><text x="860" y="653" font-size="11">v4.2 / 2026-05-06</text>
    <text x="730" y="688" font-size="10">STATUS</text><text x="860" y="688" font-size="11">Pre-CAM review</text>
  </g>
</svg>
